<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Transcript Studio</title><style>body{font-family:Arial,sans-serif;background:#f4f6f3;color:#18352e;max-width:980px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:700;font-size:18px}.pill{font-size:11px;border:1px solid #ccd9d2;border-radius:999px;padding:7px 10px;color:#718078}.hero{padding:70px 0 35px}.eyebrow{font:11px monospace;letter-spacing:.12em;color:#789088}.hero h1{font-size:clamp(42px,7vw,76px);line-height:1;letter-spacing:-.05em;margin:16px 0}.hero em{color:#6e8c52}.hero p{color:#718078;font-size:18px}.card{background:white;border:1px solid #e1e9e4;border-radius:18px;padding:24px;box-shadow:0 12px 35px #21483b08}.row{display:flex;gap:10px;margin:12px 0 22px}.row input{flex:1;border:1px solid #dbe6df;border-radius:10px;padding:14px;font-size:16px}.row button,.actions button{background:#1e463b;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.opts{display:flex;gap:18px;flex-wrap:wrap;color:#73817c;font-size:13px}.opts select{padding:6px;border:1px solid #dce6e0;border-radius:7px}.error{margin-top:16px;color:#a23d2b;background:#fff0ed;padding:12px;border-radius:10px}.meta{margin-top:26px;display:none}.meta img{width:130px;border-radius:10px;float:left;margin-right:18px}.meta h2{margin:0 0 5px}.meta a{color:#528548}.toolbar{display:flex;gap:8px;align-items:center;margin:24px 0 10px;flex-wrap:wrap}.toolbar small{color:#8b9891}.toolbar .spacer{flex:1}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{background:white;color:#426057;border:1px solid #dce6e0;padding:8px 10px;font-size:12px}.transcript{width:100%;min-height:450px;resize:vertical;border:1px solid #dbe6df;border-radius:18px;padding:24px;font:16px/1.85 Arial;color:#28443b;display:none}footer{text-align:center;margin-top:70px;color:#94a19b;font:11px monospace}@media(max-width:650px){body{padding:20px}.row{flex-wrap:wrap}.row input,.row button{width:100%}.meta img{width:90px}}</style></head><body><header><div class="logo">✦ Transcript Studio</div><div class="pill">LOCAL-FIRST · PRIVATE</div></header><section class="hero"><div class="eyebrow">YOUTUBE TRANSCRIPT WORKSPACE</div><h1>Turn any conversation<br><em>into something useful.</em></h1><p>Extract, clean, and download YouTube transcripts in seconds.</p></section><section class="card"><div class="eyebrow">VIDEO URL</div><div class="row"><input id="url" placeholder="Paste a YouTube video URL here..."><button id="go">Extract transcript</button></div><div class="opts"><label>Language <select id="lang"><option value="auto">Auto detect</option><option value="en">English</option><option value="zh-Hans">Chinese</option><option value="es">Spanish</option></select></label><label><input id="ts" type="checkbox"> Timestamps</label><label><input id="para" type="checkbox" checked> Paragraphs</label></div><div id="err" class="error" hidden></div></section><section id="meta" class="card meta"></section><div id="bar" class="toolbar" hidden><b>Transcript</b><small id="stats"></small><span class="spacer"></span><div class="actions"><button id="copy">Copy</button><button id="restore">Restore original</button><button data-ext="txt">TXT</button><button data-ext="srt">SRT</button><button data-ext="vtt">VTT</button><button data-ext="json">JSON</button></div></div><textarea id="out" class="transcript"></textarea><footer>Designed for lawful, accessible transcript extraction · No transcript data is stored</footer><script>let data;const $=id=>document.getElementById(id);function idOf(u){let m=u.match(/(?:v=|youtu\.be\/|\/(?:shorts|live)\/)([\w-]{11})/);if(!m)throw Error('Enter a valid YouTube URL.');return m[1]}$('go').onclick=async()=>{try{$('err').hidden=true;$('go').textContent='Extracting…';data=await fetch('/api/extract',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:$('url').value,language:$('lang').value,include_timestamps:$('ts').checked,add_paragraphs:$('para').checked})}).then(async r=>{let j=await r.json();if(!r.ok)throw Error(j.detail);return j});render(data)}catch(e){$('err').textContent=e.message;$('err').hidden=false}finally{$('go').textContent='Extract transcript'}};function render(d){$('meta').style.display='block';$('meta').innerHTML=`<img src="${d.thumbnail}"><div class="eyebrow">EXTRACTED TRANSCRIPT</div><h2>${d.title}</h2><p>${d.language} · ${d.word_count.toLocaleString()} words</p><a href="${d.video_url}" target="_blank">Open video ↗</a><div style="clear:both"></div>`;$('bar').hidden=false;$('out').style.display='block';$('out').value=d.transcript;$('stats').textContent=`${d.items.length} caption segments`}$('out').oninput=()=>data.transcript=$('out').value;$('copy').onclick=()=>navigator.clipboard.writeText($('out').value);$('restore').onclick=()=>{$('out').value=data.original;data.transcript=data.original};document.querySelectorAll('[data-ext]').forEach(b=>b.onclick=()=>{let e=b.dataset.ext,body=$('out').value;if(e==='json')body=JSON.stringify(data,null,2);if(e==='srt'||e==='vtt')body=(e==='vtt'?'WEBVTT\n\n':'')+data.items.map((x,i)=>`${e==='srt'?i+1+'\\n':''}${fmt(x.start)} --> ${fmt(x.start+x.duration)}\\n${x.text}\\n`).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body]));a.download='youtube-transcript.'+e;a.click()});function fmt(s){let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);return [h,m,x].map((n,i)=>String(n).padStart(2,'0')).join(':')}</script></body></html>
